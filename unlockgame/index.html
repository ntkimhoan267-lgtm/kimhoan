<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phóng viên Tourane – Escape game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --river:#0f2b2e; --river2:#15393c; --paper:#e6e9dc; --paper2:#f3f4ec; --ink:#1f2a44; --muted:#5a6275;
  --red:#b8322a; --blue:#2d5f9a; --grey:#6f6a60; --scene:#3f6b4f; --gold:#c9a24b; --machine:#8a6a1f;
  --type:"Special Elite","Courier New",monospace; --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --river:#0a1f21; --river2:#11302f; } }
:root[data-theme="dark"]{ --river:#0a1f21; --river2:#11302f; }
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--river);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:repeating-linear-gradient(170deg,rgba(255,255,255,.02) 0 3px,transparent 3px 26px);}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:12px 14px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px}
.brand{font-family:var(--type);color:var(--gold);font-size:1.05rem;line-height:1.1}
.brand small{display:block;color:#b9c6be;font-family:var(--body);font-size:.85rem}
.clock{font-family:var(--type);font-size:1.6rem;background:var(--paper);color:var(--ink);padding:2px 12px;border-radius:4px;min-width:96px;text-align:center}
.clock.low{background:var(--red);color:#fff}
.stats{font-size:.85rem;color:#b9c6be;text-align:right}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{position:relative;background:var(--paper);color:var(--ink);border-radius:6px;overflow:hidden;text-align:left;border:0;padding:0;box-shadow:0 6px 16px rgba(0,0,0,.35);display:flex;flex-direction:column}
.tile .art{aspect-ratio:300/190;background:var(--paper2)}
.tile .art svg{display:block;width:100%;height:100%}
.tile .cap{padding:6px 8px 8px;border-top:4px solid var(--c,#999);font-weight:700;font-size:.95rem;line-height:1.2}
.tile .id{position:absolute;top:6px;left:6px;background:var(--c);color:#fff;font-family:var(--type);min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:1rem;padding:0 6px;box-shadow:0 0 0 2px var(--paper)}
.tile.new{animation:drop .5s ease-out}
.tile.sel{outline:4px solid var(--gold)}
@media (prefers-reduced-motion: reduce){.tile.new{animation:none}}
@keyframes drop{from{transform:translateY(-12px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,24,26,.96);border-top:1px solid #2b4a4a;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.bar button{flex:1;max-width:120px;background:transparent;border:0;padding:6px 2px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:#dfe7df}
.bar button b{font-size:1.35rem;line-height:1}
.bar button:disabled{opacity:.35;cursor:not-allowed}
.bar button:not(:disabled):active{background:#1d3b3c}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--paper);color:var(--ink);width:100%;max-width:620px;max-height:88%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{font-family:var(--type);font-weight:400;font-size:1.35rem;margin:0 0 6px;line-height:1.2}
.panel .close{float:right;background:var(--ink);color:var(--paper);border:0;border-radius:18px;width:36px;height:36px;font-size:1.1rem}
.cardart{border-radius:6px;overflow:hidden;background:var(--paper2);margin:8px 0 10px;border:1px solid #c9ccbd}
.cardart svg{display:block;width:100%;height:auto}
.en{font-size:1.05rem}
.vi{color:var(--muted);font-style:italic;border-left:3px solid var(--gold);padding-left:10px;margin-top:8px;display:none}
.vi.show{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:11px 16px;font-weight:700}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--paper2);border:1.5px solid var(--ink);border-radius:20px;padding:6px 14px;font-family:var(--type)}
.chip.on{background:var(--ink);color:var(--paper)}
input.code{font-family:var(--type);font-size:1.6rem;letter-spacing:.3em;width:100%;padding:10px;border:2px solid var(--ink);border-radius:6px;background:var(--paper2);color:var(--ink);text-align:center;text-transform:uppercase}
.msg{margin-top:10px;padding:10px 12px;border-radius:6px;display:none}
.msg.show{display:block}
.msg.bad{background:#f3d6d2;color:#7a1c16}
.msg.ok{background:#d6ead9;color:#1f4a2b}
table.reg{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:8px}
.reg th,.reg td{border-bottom:1px dashed #9aa08c;padding:6px 4px;text-align:left}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{background:var(--paper2);border:1.5px solid #9aa08c;border-radius:6px;padding:10px;text-align:left}
.pick button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.pick small{display:block;opacity:.75;font-size:.85rem}
.intro{background:var(--paper);color:var(--ink);border-radius:8px;padding:18px 18px 20px;margin-top:6px}
.intro h1{font-family:var(--type);font-weight:400;font-size:1.7rem;line-height:1.15;margin:0 0 4px}
.intro p{margin:8px 0}
.intro ul{padding-left:20px;margin:8px 0}
.intro li{margin:4px 0}
.label-sub{color:var(--muted);font-size:.95rem;margin:0 0 6px}
.headline{font-family:var(--type);font-size:1.5rem;line-height:1.2;border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:10px 0;margin:10px 0}
.stars{font-size:2rem;letter-spacing:4px;color:var(--gold)}
.vocab{columns:2;column-gap:18px;font-size:.95rem;margin-top:8px}
.vocab div{break-inside:avoid;margin-bottom:4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--red);color:#fff;padding:8px 16px;border-radius:20px;font-weight:700;z-index:20;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<nav class="bar" id="bar" hidden>
  <button id="bTake"><b>🂠</b>Lấy thẻ</button>
  <button id="bComb"><b>➕</b>Ghép</button>
  <button id="bPhoto"><b>📷</b>Chụp</button>
  <button id="bMach"><b>⚙️</b>Máy</button>

</nav>
<div class="sheet" id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

   final:{q:"“Who is behind this? Where is Mr. Khải? And when should the police be there?”",groups:[
     {label:"Thủ phạm (có thể nhiều người)",multi:true,answer:["phu","lefevre"],options:[["phu","Mr. Phú","fish-sauce trader"],["lefevre","Sgt. Lefèvre","customs officer"],["nam","Ông Năm","old fisherman"],["hanh","Mrs. Hạnh","keeper's wife"],["khai","Mr. Khải","lighthouse keeper"],["bao","Editor Bảo","tổng biên tập"]]},
     {label:"Ông Khải bị giữ ở",answer:"3",options:[["1","Cave 1"],["2","Cave 2"],["3","Cave 3"]]},
     {label:"Cảnh sát nên đến lúc",answer:"21:40",options:[["03:05","03:05"],["09:12","09:12"],["15:30","15:30"],["21:40","21:40"]]}]},
   win:{head:"LIGHTHOUSE KEEPER RESCUED FROM SMUGGLERS' CAVE!",vi:"Người gác hải đăng được giải cứu khỏi hang của bọn buôn lậu!",
     story:"Đúng 21:40, khi nước lớn, cảnh sát ập vào hang số 3 cạnh hòn đá con rùa. Ông Khải được cứu, ông Phú và trung sĩ Lefèvre bị bắt cùng những thùng ngọc trai buôn lậu. Ngọn hải đăng Tiên Sa sáng trở lại.",
     vocab:[["run aground","mắc cạn"],["missing","mất tích"],["lighthouse keeper","người gác hải đăng"],["fail","hỏng, không hoạt động"],["switch off","tắt"],["junk","thuyền buồm (kiểu Á)"],["sunset","hoàng hôn"],["spare key","chìa khóa dự phòng"],["padlock","ổ khóa móc"],["wire","dây điện"],["pliers","cái kìm"],["torn","bị rách"],["engraved","được khắc"],["customs","thuế quan, hải quan"],["logbook","sổ nhật ký"],["basket boat","thuyền thúng"],["anchored","thả neo"],["warehouse","nhà kho"],["high tide / low tide","nước lớn / nước ròng"],["tied up","bị trói"],["password","mật khẩu"],["pearl","ngọc trai"],["smuggled","buôn lậu"],["peninsula","bán đảo"],["cave","hang động"]]}}
};
const COLORS={scene:SC,red:R,blue:B,char:G,item:G,doc:G,machine:Y};
const PEN=120;
let LV=null,CARDS=null,ART=null,st=null;
const $=id=>document.getElementById(id);
function setLevel(n){LV=LEVELS[n];LV.n=n;CARDS=LV.cards;ART=LV.art}
function save(){try{localStorage.setItem(LV.key,JSON.stringify(st))}catch(e){}}
function loadK(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function fresh(){return {rev:["A"],pen:0,hints:0,hintLv:{},start:Date.now(),done:false,endAt:null}}
function remaining(){const now=st.done?st.endAt:Date.now();return LV.total-Math.floor((now-st.start)/1000)-st.pen*PEN}
function fmt(s){const n=Math.abs(s),m=Math.floor(n/60),x=n%60;return (s<0?"-":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function toast(t){const e=$("toast");e.style.background="";e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
function toast2(t){const e=$("toast");e.style.background="var(--scene)";e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>{e.classList.remove("show");e.style.background=""},1800)}
function penalty(msg){st.pen++;save();toast("−2 phút · "+msg);renderHeader()}
/* ---------- MENU ---------- */
function menu(){
  clearInterval(game.t);$("bar").hidden=true;
  const lv=n=>{const s=loadK(LEVELS[n].key);return s?(s.done?"✓ Đã phá đảo":"Đang chơi dở"):""};
  $("root").innerHTML=`<div class="intro"><h1>Phóng viên Tourane</h1>
  <p>Bạn là phóng viên của báo <b>Hàn Giang</b> ở Đà Nẵng xưa. Mỗi màn là một vụ án — tìm ra sự thật trước khi hết giờ.</p>
  <ul><li><b>🂠 Lấy thẻ:</b> nhập số/chữ bạn thấy trên tranh — kể cả số <b>ẩn</b>.</li>
  <li><b>➕ Ghép:</b> chọn 2 thẻ (thường là <span style="color:#b8322a;font-weight:700">đỏ</span> + <span style="color:#2d5f9a;font-weight:700">xanh</span>), số cộng lại thành thẻ mới.</li>
  <li><b>📷 Chụp:</b> khi có máy ảnh, chụp một cảnh (thẻ chữ cái).</li>
  <li><b>⚙️ Máy:</b> mở khóa, nhập mã. <b>💡 Gợi ý:</b> 2 mức cho mỗi thẻ.</li></ul>
  <p>Sai bị <b>trừ 2 phút</b>. Thẻ bài bằng tiếng Anh — bấm <b>“Dịch”</b> để xem tiếng Việt.</p></div>
  <div class="modes" style="display:grid;gap:12px;margin-top:14px">${[1,2].map(n=>`<div class="intro" style="margin:0"><h2 style="font-family:var(--type);font-weight:400;margin:0 0 4px">${LEVELS[n].name}</h2><p class="label-sub" style="margin:0">${LEVELS[n].blurb}</p><p style="margin:6px 0 0;font-weight:700">${lv(n)}</p>
  <div class="row"><button class="btn gold" data-go="${n}">${loadK(LEVELS[n].key)&&!loadK(LEVELS[n].key).done?"Chơi tiếp":"Bắt đầu"}</button>${loadK(LEVELS[n].key)?`<button class="btn alt" data-reset="${n}">Chơi lại</button>`:""}</div></div>`).join("")}</div>`;
  $("root").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{setLevel(+b.dataset.go);const s=loadK(LV.key);st=s&&!s.done?s:fresh();save();game()});
  $("root").querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{setLevel(+b.dataset.reset);st=fresh();save();game()});
}
/* ---------- GAME ---------- */
function renderHeader(){
  const h=$("hdr");if(!h)return;const r=remaining();
  h.innerHTML=`<button class="brand" id="home" style="background:none;border:0;padding:0;text-align:left">‹ ${LV.year}<small>${st.rev.length}/${Object.keys(CARDS).length} thẻ</small></button>
  <div class="clock ${r<300?"low":""}" aria-label="Thời gian còn lại">${fmt(r)}</div>
  <div class="stats">Phạt: ${st.pen}<br>Gợi ý: ${st.hints}</div>`;
  $("home").onclick=menu;
}
function game(){
  $("bar").hidden=false;
  $("root").innerHTML=`<header id="hdr"></header><div class="board" id="board"></div>`;
  renderHeader();renderBoard();updateBar();
  clearInterval(game.t);game.t=setInterval(renderHeader,1000);
}
function tile(id,isNew){const c=CARDS[id],col=COLORS[c.k];
  return `<button class="tile ${isNew?"new":""}" data-id="${id}" style="--c:${col}"><div class="art">${ART[id]()}</div><span class="id">${id}</span><div class="cap">${c.t}</div></button>`}
function renderBoard(newId){$("board").innerHTML=st.rev.slice().reverse().map(id=>tile(id,id===newId)).join("");
  $("board").querySelectorAll(".tile").forEach(b=>b.onclick=()=>openCard(b.dataset.id))}
function updateBar(){$("bPhoto").disabled=!st.rev.includes(LV.photoItem)}
function openSheet(html){$("panel").innerHTML=`<button class="close" aria-label="Đóng" id="x">✕</button>`+html;$("sheet").classList.add("open");$("x").onclick=closeSheet;$("x").focus()}
function closeSheet(){$("sheet").classList.remove("open")}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function openCard(id){
  const c=CARDS[id];const vis=(c.shows||[]).filter(x=>!st.rev.includes(x));
  openSheet(`<h2>${id} · ${c.t}</h2><p class="label-sub">${c.tv}</p><div class="cardart">${ART[id]()}</div>
  <div class="en">${c.en}</div>${c.extra||""}<div class="vi" id="vi">${c.vi}</div>
  <div class="row"><button class="btn alt" id="tr">Dịch</button>${vis.length?`<button class="btn" id="tk">Lấy thẻ ${vis.join(", ")}</button>`:""}</div>`);
  $("tr").onclick=()=>{$("vi").classList.toggle("show");$("tr").textContent=$("vi").classList.contains("show")?"Ẩn bản dịch":"Dịch"};
  if($("tk"))$("tk").onclick=()=>{let last;vis.forEach(v=>{if(!st.rev.includes(v)){st.rev.push(v);last=v}});save();closeSheet();renderBoard(last);renderHeader();updateBar();toast2("Đã lấy thẻ "+vis.join(", "))};
}
function reveal(id,msg){if(st.rev.includes(id)){toast2("Bạn đã có thẻ "+id);return}st.rev.push(id);save();closeSheet();renderBoard(id);renderHeader();updateBar();toast2(msg||("Lấy được thẻ "+id));setTimeout(()=>openCard(id),350)}
function visibleSet(){const s=new Set();st.rev.forEach(id=>{(CARDS[id].shows||[]).forEach(x=>s.add(x));(CARDS[id].hidden||[]).forEach(x=>s.add(x))});return s}
$("bTake").onclick=()=>{
  const shown=[];st.rev.forEach(id=>(CARDS[id].shows||[]).forEach(x=>{if(!st.rev.includes(x)&&!shown.includes(x))shown.push(x)}));
  openSheet(`<h2>Lấy thẻ</h2><p class="label-sub">Nhập số hoặc chữ bạn thấy trên các thẻ — kể cả số ẩn trong tranh.</p>
  ${shown.length?`<div class="chips">${shown.map(x=>`<button class="chip" data-v="${x}">${x}</button>`).join("")}</div>`:""}
  <input class="code" id="in" maxlength="3" autocomplete="off" aria-label="Số thẻ"><div class="row"><button class="btn" id="ok">Lấy thẻ</button></div>`);
  $("panel").querySelectorAll(".chip").forEach(c=>c.onclick=()=>reveal(c.dataset.v));
  const go=()=>{const v=$("in").value.trim().toUpperCase();if(!v)return;
    if(st.rev.includes(v)){toast2("Bạn đã có thẻ "+v);return}
    if(visibleSet().has(v)&&CARDS[v])reveal(v);else{closeSheet();penalty("Không thấy thẻ "+v+" ở đâu cả")}};
  $("ok").onclick=go;$("in").onkeydown=e=>{if(e.key==="Enter")go()};
};
$("bComb").onclick=()=>{
  const list=st.rev.filter(id=>!["scene","machine"].includes(CARDS[id].k)&&!isNaN(+id));let sel=[];
  openSheet(`<h2>Ghép hai thẻ</h2><p class="label-sub">Chọn 2 thẻ. Số của chúng sẽ được cộng lại.</p><div class="board" id="cb">${list.map(id=>tile(id)).join("")}</div>
  <div class="row"><button class="btn" id="ok" disabled>Ghép</button></div><p class="label-sub" id="sum"></p>`);
  $("cb").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const id=b.dataset.id;
    if(sel.includes(id))sel=sel.filter(x=>x!==id);else{if(sel.length===2)sel.shift();sel.push(id)}
    $("cb").querySelectorAll(".tile").forEach(t=>t.classList.toggle("sel",sel.includes(t.dataset.id)));
    $("ok").disabled=sel.length!==2;$("sum").textContent=sel.length===2?`${sel[0]} + ${sel[1]} = ${(+sel[0])+(+sel[1])}`:""});
  $("ok").onclick=()=>{const k=sel.map(Number).sort((a,b)=>a-b).join("+");const r=LV.combos[k];
    if(r)reveal(r,`${sel[0]} + ${sel[1]} = ${r}`);else{closeSheet();penalty("Hai thẻ này không ghép được")}};
};
$("bPhoto").onclick=()=>{
  const scenes=st.rev.filter(id=>CARDS[id].k==="scene");
  openSheet(`<h2>📷 Chụp ảnh</h2><p class="label-sub">Chọn cảnh bạn muốn chụp.</p><div class="chips">${scenes.map(x=>`<button class="chip" data-v="${x}">${x} · ${CARDS[x].t}</button>`).join("")}</div>`);
  $("panel").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const p=CARDS[c.dataset.v].photo;
    if(p&&!st.rev.includes(p))reveal(p,"Tách! Ảnh đã chụp xong.");else if(p)toast2("Bạn đã chụp cảnh này rồi");else{closeSheet();penalty("Không có gì đáng chụp ở đây")}});
};
$("bMach").onclick=()=>{
  openSheet(`<h2>⚙️ Máy</h2><p class="label-sub">Nhập số của máy (thẻ có viền vàng nâu).</p><input class="code" id="in" maxlength="2" inputmode="numeric" aria-label="Số máy"><div class="row"><button class="btn" id="ok">Mở máy</button></div>`);
  const go=()=>{const v=$("in").value.trim();const m=LV.machines[v];
    if(!m||!st.rev.includes(m.need)){closeSheet();penalty("Không có máy số "+v);return}
    m.kind==="code"?codeLock(v,m):finalCall()};
  $("ok").onclick=go;$("in").onkeydown=e=>{if(e.key==="Enter")go()};
};
function codeLock(id,m){
  if(st.rev.includes(m.reward)){toast2("Khóa đã mở rồi");closeSheet();return}
  openSheet(`<h2>Máy ${id} · ${m.title}</h2><div class="cardart">${ART[id]()}</div><input class="code" id="cd" maxlength="${m.code.length}" ${m.text?'autocapitalize="characters"':'inputmode="numeric"'} autocomplete="off" aria-label="Mã khóa"><div class="row"><button class="btn" id="ok">Mở khóa</button></div>`);
  const go=()=>{if($("cd").value.trim().toUpperCase()===m.code)reveal(m.reward,"Cạch! Khóa đã mở.");else{closeSheet();penalty("Sai mã")}};
  $("ok").onclick=go;$("cd").onkeydown=e=>{if(e.key==="Enter")go()};
}
function finalCall(){
  const F=LV.final;const ans=F.groups.map(g=>g.multi?new Set():null);
  openSheet(`<h2>Gọi cho tổng biên tập</h2><p class="en">${F.q}</p>${F.groups.map((g,i)=>`<p class="label-sub" style="margin-top:14px">${g.label}:</p>${g.multi?`<div class="pick" data-g="${i}">${g.options.map(([k,n,d])=>`<button data-k="${k}">${n}<small>${d}</small></button>`).join("")}</div>`:`<div class="chips" data-g="${i}">${g.options.map(([k,n])=>`<button class="chip" data-k="${k}">${n}</button>`).join("")}</div>`}`).join("")}
  <div class="row"><button class="btn gold" id="ok">Gửi bài</button></div>`);
  F.groups.forEach((g,i)=>{const box=$("panel").querySelector(`[data-g="${i}"]`);box.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(g.multi){ans[i].has(k)?ans[i].delete(k):ans[i].add(k);b.classList.toggle("on")}else{ans[i]=k;box.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}})});
  $("ok").onclick=()=>{
    if(ans.some(a=>a===null||(a instanceof Set&&!a.size))){toast("Trả lời đủ tất cả các câu trước");return}
    const right=F.groups.every((g,i)=>g.multi?(ans[i].size===g.answer.length&&g.answer.every(x=>ans[i].has(x))):ans[i]===g.answer);
    if(right){st.done=true;st.endAt=Date.now();save();closeSheet();win()}else{closeSheet();penalty("Tổng biên tập: “Chưa đủ bằng chứng!”")}
  };
}
function win(){
  clearInterval(game.t);$("bar").hidden=true;const r=remaining();const W=LV.win;
  const stars=r>=LV.total/3&&st.hints<=2?3:r>=0?2:1;
  $("root").innerHTML=`<div class="intro"><p class="label-sub">Hàn Giang Daily · Evening edition</p>
  <div class="headline">${W.head}</div><p><i>${W.vi}</i></p><p>${W.story}</p>
  <div class="stars" aria-label="${stars} sao">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
  <p>Thời gian còn lại: <b>${fmt(r)}</b> · Phạt: <b>${st.pen}</b> · Gợi ý: <b>${st.hints}</b></p>
  <h2 style="font-family:var(--type);font-weight:400;margin:16px 0 4px">Từ vựng trong màn này</h2>
  <div class="vocab">${W.vocab.map(([e,v])=>`<div><b>${e}</b> – ${v}</div>`).join("")}</div>
  <div class="row"><button class="btn" id="again">Chơi lại</button><button class="btn alt" id="mn">Chọn màn khác</button></div></div>`;
  $("again").onclick=()=>{st=fresh();save();game()};$("mn").onclick=menu;
}
$("bHint").onclick=()=>{
  openSheet(`<h2>💡 Gợi ý</h2><p class="label-sub">Chọn thẻ bạn đang bí.</p><div class="chips">${st.rev.map(id=>`<button class="chip" data-v="${id}">${id} · ${CARDS[id].t}</button>`).join("")}</div><div class="msg ok" id="hm"></div><div class="row" id="hr"></div>`);
  $("panel").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const id=c.dataset.v,hs=CARDS[id].h;let lv=st.hintLv[id]||0;
    const show=()=>{$("hm").classList.add("show");$("hm").innerHTML=hs.slice(0,lv).map((t,i)=>`<p style="margin:4px 0"><b>Gợi ý ${i+1}:</b> ${t}</p>`).join("");
      $("hr").innerHTML=lv<hs.length?`<button class="btn alt" id="more">Xem gợi ý ${lv+1}</button>`:"";
      if($("more"))$("more").onclick=()=>{lv++;st.hintLv[id]=lv;st.hints++;save();renderHeader();show()}};
    if(lv===0){$("hm").classList.remove("show");$("hm").innerHTML=""}show();
    if(lv===0)$("hm").classList.remove("show");
    $("panel").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c))});
};
menu();
</script>
</body>
</html>
