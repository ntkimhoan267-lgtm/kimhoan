<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A5C">
<title>Ngũ Sắc Kỳ</title>
<style>
:root{
  --navy:#0E2A5C; --navy-deep:#091D42; --paper:#F2EADA; --paper-hi:#FBF6EC; --paper-lo:#E4D9C4;
  --gold:#E8B317; --red:#C0362C; --red-deep:#7E1C14; --ink:#1A2233; --muted:#5B6275;
  --q1:#14418C; --q2:#E8B317; --q3:#C0362C; --q4:#FFF8EA; --q5:#E2711D;
  --serif: "Noto Serif", "Source Serif Pro", Cambria, Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--navy);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.5;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2}
b,strong{font-weight:700}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--navy-deep);border-bottom:1px solid rgba(242,234,218,.14);padding:env(safe-area-inset-top) 0 0}
.bar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.flag{display:flex;height:22px;width:30px;flex:none;border:1px solid rgba(242,234,218,.5)}
.flag i{flex:1}
.brand span{font-family:var(--serif);font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em;white-space:nowrap;color:var(--paper)}
.bar-btn{min-height:44px;padding:0 10px;white-space:nowrap;flex:none;border:1px solid rgba(242,234,218,.35);border-radius:6px;font-size:16px;color:var(--paper)}
.bar-btn:active{background:rgba(242,234,218,.1)}

main{max-width:600px;margin:0 auto;padding:16px 14px 48px}

/* ---------- common ---------- */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:10px 18px;border-radius:8px;font-size:18px;font-weight:600;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-paper{background:var(--paper);color:var(--navy)}
.btn-line{border:1.5px solid rgba(242,234,218,.6);color:var(--paper)}
.btn-red{background:var(--red);color:#fff}
.btn-navy{background:var(--navy);color:var(--paper)}
.stack>*+*{margin-top:12px}
.panel{background:var(--paper);color:var(--ink);border-radius:10px;padding:18px 16px}
.panel h2{font-size:22px;color:var(--navy)}
.panel p{color:var(--ink)}
.muted{color:var(--muted)}
.on-navy .muted,.lede{color:rgba(242,234,218,.78)}
.gap{height:16px}
.err{background:#FBE3DF;color:var(--red-deep);border-left:4px solid var(--red);padding:10px 12px;border-radius:4px;font-size:16px}

/* ---------- setup ---------- */
.hero{text-align:center;padding:12px 0 20px}
.hero-flag{display:flex;height:72px;max-width:260px;margin:0 auto 18px;border:1px solid rgba(242,234,218,.4)}
.hero-flag i{flex:1}
.hero h1{font-size:40px;letter-spacing:.1em;color:var(--paper)}
.hero p{margin-top:8px;color:rgba(242,234,218,.8);font-size:17px}
.virtues{display:flex;justify-content:center;gap:14px;margin-top:14px;font-family:var(--serif);font-size:16px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-width:52px;min-height:48px;padding:0 12px;border-radius:8px;border:1.5px solid rgba(14,42,92,.35);background:var(--paper-hi);color:var(--navy);font-size:18px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.chip small{font-weight:500;font-size:16px}
.comp{margin-top:12px;font-size:16px}
.comp .roles{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:16px;line-height:1.6}
.tag-lam{background:rgba(20,65,140,.12);color:var(--q1);border:1px solid rgba(20,65,140,.35)}
.tag-do{background:rgba(192,54,44,.1);color:var(--red-deep);border:1px solid rgba(192,54,44,.4)}
.names{margin-top:12px;display:grid;gap:8px}
.names label{display:flex;align-items:center;gap:10px}
.names .num{width:28px;text-align:right;font-family:var(--serif);font-weight:700;color:var(--muted);flex:none}
.names input{flex:1;min-width:0;min-height:48px;padding:8px 12px;font:inherit;font-size:17px;border:1.5px solid rgba(14,42,92,.3);border-radius:8px;background:var(--paper-hi);color:var(--ink)}
.names input:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(232,179,23,.5)}

/* ---------- role picker ---------- */
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{min-height:44px;padding:0 4px;color:var(--q1);text-decoration:underline;font-size:16px;white-space:nowrap}
.rp-head{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px}
.rp-head h3{font-size:18px}
.cnt{font-weight:700;font-size:16px;color:var(--red-deep);background:rgba(192,54,44,.1);padding:1px 10px;border-radius:99px}
.cnt.ok{color:var(--q1);background:rgba(20,65,140,.1)}
.rpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rb{display:flex;align-items:center;gap:8px;min-height:60px;padding:6px 8px;border-radius:8px;border:1.5px solid rgba(14,42,92,.2);background:var(--paper-hi);color:var(--ink);text-align:left;opacity:.62}
.rb img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;filter:grayscale(1)}
.rb span{min-width:0;line-height:1.2}
.rb b{display:block;font-size:16px;font-weight:600}
.rb small{display:block;font-size:16px;color:var(--muted);font-family:var(--serif);font-style:italic}
.rb[aria-pressed="true"]{opacity:1;border-color:var(--q1);box-shadow:inset 0 0 0 1px var(--q1)}
.rb.do[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.rb[aria-pressed="true"] img{filter:none}
.info{margin-top:12px;background:rgba(20,65,140,.08);border-left:4px solid var(--q1);padding:10px 12px;border-radius:4px;font-size:16px}
@media (max-width:374px){.rpick{grid-template-columns:1fr}}

/* ---------- board ---------- */
.board{background:var(--paper);border-radius:10px;padding:12px 10px 14px;color:var(--ink)}
.quests{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.q{position:relative;background:var(--paper-hi);border:1px solid rgba(14,42,92,.35);border-radius:6px;overflow:hidden;text-align:center;padding:0 2px 8px;min-height:104px;display:flex;flex-direction:column;align-items:center}
.q .band{align-self:stretch;height:12px;border-bottom:1px solid rgba(14,42,92,.25);margin:0 -2px 6px}
.q .nm{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.03em;color:var(--navy)}
.q .sz{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.1;color:var(--navy)}
.q .nd{font-size:16px;line-height:1.1;color:var(--red-deep);font-weight:700}
.q.cur{box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--navy);z-index:1}
.q.ok .band{border-bottom-color:transparent}
.q.fail{background:var(--paper-lo)}
.q .nm,.q .sz,.q .nd{position:relative;z-index:1}
.q.fail .nm,.q.fail .sz,.q.fail .nd{color:var(--navy);text-shadow:0 0 3px var(--paper-lo),0 0 3px var(--paper-lo),0 0 6px var(--paper-lo)}
.q .x{position:absolute;inset:14px 0 0 0;width:100%;height:calc(100% - 14px);pointer-events:none}
.q .tick{font-size:16px;font-weight:700;margin-top:2px}
.track{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.track .lbl{font-size:16px;color:var(--muted);margin-right:2px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--navy);background:var(--paper-hi)}
.dot.on{background:var(--navy);color:var(--gold)}
.dot.last{border-color:var(--red);color:var(--red)}
.dot.last.on{background:var(--red);color:#fff}
.track .end{font-size:16px;color:var(--red-deep)}
.score{display:flex;gap:14px;margin-top:10px;font-size:16px;color:var(--muted)}

/* ---------- players ---------- */
.plist{list-style:none;margin-top:12px;display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border-radius:8px;border:1.5px solid rgba(14,42,92,.25);background:var(--paper-hi);color:var(--ink);text-align:left;font-size:17px}
button.prow[aria-pressed="true"]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
button.prow[aria-pressed="true"] .box{background:var(--gold);border-color:var(--gold)}
button.prow[aria-pressed="true"] .box::after{opacity:1}
button.prow[disabled]{cursor:default}
.box{width:24px;height:24px;border-radius:5px;border:2px solid rgba(14,42,92,.5);flex:none;position:relative}
.box::after{content:"";position:absolute;left:6px;top:1px;width:7px;height:13px;border:solid var(--navy);border-width:0 3px 3px 0;transform:rotate(45deg);opacity:0}
.prow .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.lead{flex:none;background:var(--gold);color:var(--navy);font-weight:700;font-size:16px;padding:1px 10px;border-radius:99px}
.count{margin-top:12px;font-size:16px;color:var(--muted)}

.team-pub{background:var(--paper-hi);border:1px solid rgba(14,42,92,.25);border-left:4px solid var(--q1);border-radius:8px;padding:10px 12px;font-size:16px;margin:10px 0}
.vrow .vtag{flex:none;font-size:16px;font-weight:700;color:var(--muted)}
button.vrow[aria-pressed="true"]{background:var(--q1);border-color:var(--q1);color:#fff}
button.vrow[aria-pressed="true"] .vtag{color:var(--gold)}
button.vrow[aria-pressed="true"] .lead{background:var(--gold);color:var(--navy)}

/* ---------- log ---------- */
details.log{margin-top:16px;background:rgba(242,234,218,.06);border:1px solid rgba(242,234,218,.18);border-radius:10px}
details.log summary{min-height:48px;padding:12px 16px;cursor:pointer;font-family:var(--serif);font-weight:700;font-size:18px;list-style:none}
details.log summary::-webkit-details-marker{display:none}
details.log summary::after{content:"+";float:right;font-family:var(--sans);font-weight:400}
details.log[open] summary::after{content:"−"}
.log-body{padding:0 16px 14px}
.entry{border-left:6px solid;padding:4px 0 6px 12px;margin-top:12px}
.entry h3{font-size:18px}
.entry p{font-size:16px;color:rgba(242,234,218,.85)}
.entry .prop{margin-top:4px}
.res-ok{color:#9FD39B;font-weight:700}
.res-fail{color:#FF9B8F;font-weight:700}
.empty{font-size:16px;color:rgba(242,234,218,.7);padding-bottom:4px}

/* ---------- pass / secret screens ---------- */
.pass{min-height:calc(100vh - 140px);min-height:calc(100dvh - 140px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:12px 4px}
.pass .flag-line{display:flex;height:6px;width:150px;margin:0 auto 26px}
.pass .flag-line i{flex:1}
.pass .to{font-size:18px;color:rgba(242,234,218,.8)}
.pass .who{font-family:var(--serif);font-size:40px;color:var(--gold);margin:6px 0 10px;overflow-wrap:anywhere}
.pass .why{color:rgba(242,234,218,.8);max-width:34ch;margin:0 auto 28px}
.pass .note{font-size:16px;color:rgba(242,234,218,.65);margin-bottom:18px}
.secret-head{text-align:center;margin-bottom:14px}
.secret-head .who{font-family:var(--serif);font-size:26px;color:var(--gold)}
.secret-head p{color:rgba(242,234,218,.8);font-size:16px}

/* card */
.card-slot{min-height:430px;display:flex;align-items:stretch;justify-content:center}
.card{width:100%;max-width:360px;border-radius:14px;padding:18px 18px 20px;text-align:center;background:var(--paper);color:var(--ink);border:1px solid rgba(14,42,92,.4);box-shadow:0 0 0 6px var(--paper),0 0 0 7px rgba(14,42,92,.35)}
.card.do{box-shadow:0 0 0 6px var(--paper),0 0 0 8px var(--red)}
.card.lam{box-shadow:0 0 0 6px var(--paper),0 0 0 8px var(--q1)}
.back{width:100%;max-width:360px;border-radius:14px;background:var(--navy-deep);border:1px solid rgba(242,234,218,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.back .vflag{display:flex;flex-direction:column;width:90px;height:150px;border:1px solid rgba(242,234,218,.5)}
.back .vflag i{flex:1}
.back span{font-family:var(--serif);font-weight:700;letter-spacing:.14em;font-size:20px}
.back em{font-style:normal;color:rgba(242,234,218,.7);font-size:16px}
.portrait{width:132px;height:132px;border-radius:50%;margin:0 auto 10px;display:block;object-fit:cover;border:3px solid var(--navy)}
.card.do .portrait{border-color:var(--red)}
.card .power{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted)}
.card h2{font-size:25px;color:var(--navy);margin:2px 0 8px}
.card.do h2{color:var(--red-deep)}
.side{display:inline-block;font-weight:700;font-size:16px;padding:2px 12px;border-radius:99px;margin-bottom:10px}
.side.lam{background:var(--q1);color:#fff}
.side.do{background:var(--red);color:#fff}
.card .desc{font-size:16px;text-align:left}
.sees{margin-top:12px;text-align:left;background:var(--paper-hi);border:1px solid rgba(14,42,92,.2);border-radius:8px;padding:10px 12px;font-size:16px}
.sees b{display:block;font-family:var(--serif);color:var(--navy);margin-bottom:2px}
.sees ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sees li{background:var(--navy);color:var(--gold);padding:2px 12px;border-radius:99px;font-weight:700}
.card.do .sees li{background:var(--red-deep);color:#fff}
.emblem{display:flex;width:84px;height:120px;margin:4px auto 12px;border:2px solid var(--navy)}
.emblem i{flex:1}

.hold{margin-top:22px;width:100%;min-height:72px;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:700;font-size:19px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hold.active{background:var(--paper)}

/* vote & mission choice */
.team-line{background:rgba(242,234,218,.08);border:1px solid rgba(242,234,218,.2);border-radius:8px;padding:10px 12px;font-size:16px;margin-bottom:16px;text-align:center}
.team-line b{color:var(--gold)}
.choices{display:grid;gap:14px}
.choice{min-height:120px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.06em}
.choice small{font-family:var(--sans);font-size:16px;font-weight:500;letter-spacing:0}
.ch-yes{background:var(--paper);color:var(--navy)}
.ch-no{background:var(--navy-deep);color:var(--paper);border:2px solid var(--red)}
.ch-hp{background:var(--gold);color:var(--navy)}
.ch-ph{background:var(--red);color:#fff}
.ch-locked{min-height:120px;border-radius:12px;border:1.5px dashed rgba(242,234,218,.35);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:rgba(242,234,218,.7);font-size:16px}

/* reveal results */
.verdict{text-align:center;margin:6px 0 16px}
.verdict h2{font-size:30px}
.verdict p{color:rgba(242,234,218,.85)}
.vt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcol{background:var(--paper);color:var(--ink);border-radius:10px;padding:12px}
.vcol h3{font-size:18px;margin-bottom:6px}
.vcol.yes h3{color:var(--navy)}
.vcol.no h3{color:var(--red-deep)}
.vcol ul{list-style:none;font-size:16px}
.vcol li{padding:3px 0;border-top:1px solid rgba(14,42,92,.12);overflow-wrap:anywhere}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0 20px;perspective:800px}
.mc{width:64px;height:96px;position:relative;transform-style:preserve-3d;transition:transform .5s ease}
.mc.flip{transform:rotateY(180deg)}
.mc>div{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.15;padding:4px}
.mc .f{background:var(--navy-deep);border:1px solid rgba(242,234,218,.4)}
.mc .f i{display:flex;width:26px;height:40px;border:1px solid rgba(242,234,218,.5)}
.mc .f i b{flex:1}
.mc .bk{transform:rotateY(180deg)}
.mc .bk.hp{background:var(--gold);color:var(--navy)}
.mc .bk.ph{background:var(--red);color:#fff}
@media (prefers-reduced-motion:reduce){.mc{transition:none}.btn{transition:none}}

/* chỉ mặt */
.ahead{text-align:center;margin:4px 0 16px}
.ahead h2{font-size:26px;color:var(--gold)}
.ahead p{color:rgba(242,234,218,.85);max-width:36ch;margin:6px auto 0;font-size:16px}
.ahead b{color:var(--paper)}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;perspective:1000px}
.ac{display:block;width:100%;padding:0;border:0;background:none;-webkit-tap-highlight-color:transparent}
.ac-in{position:relative;width:100%;aspect-ratio:2/3;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1),box-shadow .2s;border-radius:10px}
.ac.flip .ac-in{transform:rotateY(180deg)}
.ac .af,.ac .ab{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;overflow:hidden}
.ac .af{background:var(--navy-deep);border:1.5px solid rgba(242,234,218,.35)}
.ac .afl{display:flex;flex-direction:column;width:34px;height:52px;border:1px solid rgba(242,234,218,.45);flex:none}
.ac .afl i{flex:1}
.ac .afn{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--paper);text-align:center;line-height:1.15;overflow-wrap:anywhere}
.ac[aria-pressed="true"] .af{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.ac[aria-pressed="true"] .afn{color:var(--gold)}
.ac .ab{transform:rotateY(180deg);background:var(--paper);border:1.5px solid var(--q1)}
.ac .ab.do{border-color:var(--red)}
.ac .ab img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--q1)}
.ac .ab.do img{border-color:var(--red)}
.ac .ab b{font-family:var(--serif);font-size:16px;line-height:1.15;text-align:center;color:var(--navy);overflow-wrap:anywhere}
.ac .ab.do b{color:var(--red-deep)}
.ac.dim{opacity:.4}
.ac.target .ac-in{box-shadow:0 0 0 3px var(--gold)}
.alate{margin-top:18px;animation:fadeUp .5s ease both;animation-delay:1.1s}
.averdict{text-align:center;font-family:var(--serif);font-size:21px;font-weight:700;margin-bottom:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ac-in{transition:none}.alate{animation:none}}

/* end */
.win{text-align:center;padding:10px 0 18px}
.win .flag-big{display:flex;height:54px;max-width:220px;margin:0 auto 16px;border:1px solid rgba(242,234,218,.4)}
.win .flag-big i{flex:1}
.win .flag-big.down{filter:grayscale(1) brightness(.6)}
.win h1{font-size:32px}
.win.lam h1{color:var(--gold)}
.win.do h1{color:#FF8A7D}
.win p{color:rgba(242,234,218,.85);margin-top:6px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.rc{background:var(--paper);color:var(--ink);border-radius:10px;padding:10px;text-align:center;border-top:6px solid var(--q1)}
.rc.do{border-top-color:var(--red)}
.rc img{width:76px;height:76px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px}
.rc .pn{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.rc .rn{font-family:var(--serif);font-size:16px;color:var(--muted);line-height:1.3}
.section-title{font-size:22px;margin:24px 0 4px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,14,32,.72);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:600px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:600px){.sheet{border-radius:14px}}
.sheet h2{font-size:24px;color:var(--navy);margin-bottom:8px}
.sheet h3{font-size:19px;color:var(--navy);margin:18px 0 4px}
.sheet p,.sheet li{font-size:16px}
.sheet ul,.sheet ol{padding-left:22px}
.sheet li+li{margin-top:4px}
.sheet table{border-collapse:collapse;width:100%;font-size:16px;margin-top:6px}
.sheet th,.sheet td{border:1px solid rgba(14,42,92,.25);padding:4px 6px;text-align:center}
.sheet th{background:var(--paper-lo);font-weight:700}
.tbl-wrap{overflow-x:auto}
.qline{display:flex;margin:8px 0 2px;border:1px solid rgba(14,42,92,.3)}
.qline span{flex:1;text-align:center;font-family:var(--serif);font-weight:700;padding:4px 0}
.sheet .row{display:flex;gap:10px;margin-top:18px}
.sheet .row .btn{flex:1}
</style>
</head>

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function flagIs(){return '<i style="background:var(--q1)"></i><i style="background:var(--q2)"></i><i style="background:var(--q3)"></i><i style="background:var(--q4)"></i><i style="background:var(--q5)"></i>';}
function nameOf(i){return S.players[i].name;}
function roleOf(i){return ROLES[S.players[i].role];}
function joinNames(ids){return ids.map(function(i){return esc(nameOf(i));}).join(", ");}
function loadSaved(){

}
function saveNames(n,names){try{localStorage.setItem(STORE_KEY,JSON.stringify({n:n,names:names,picks:draft.picks}));}catch(e){}}
function defaultPick(n){return BLUE.slice(0,TABLE[n][0]).concat(RED.slice(0,TABLE[n][1]));}
function getPick(n){var p=draft.picks[n];return Array.isArray(p)?p:defaultPick(n);}
function pickCounts(n){var p=getPick(n),b=0,r=0;p.forEach(function(x){if(ROLES[x].side==="lam")b++;else r++;});return {b:b,r:r,ok:b===TABLE[n][0]&&r===TABLE[n][1]};}

/* ================= MÀN: XEM VAI ================= */
function knowledge(i){
  var r=S.players[i].role, others=[], label="", extra="";
  function ids(f){var a=[];S.players.forEach(function(p,j){if(j!==i&&f(p.role))a.push(j);});return shuffle(a).sort(function(x,y){return nameOf(x).localeCompare(nameOf(y),"vi");});}
  if(r==="qd"){ others=ids(function(x){return ROLES[x].side==="do"&&x!=="diem";}); label="Phe Đỏ Đen bạn nhìn thấy";
    var hasDiem=S.players.some(function(p){return p.role==="diem";});
    extra = hasDiem?"Ngô Đình Diệm ẩn mặt — hắn không nằm trong danh sách này.":"";
    if(!others.length&&!hasDiem) extra="Không có ai.";
    if(!S.players.some(function(p){return p.role==="nhu";})) extra+=(extra?" ":"")+"Ván này không có Ngô Đình Nhu, nhưng phe Đỏ Đen vẫn được một lần chỉ mặt bạn ở cuối ván."; }
  else if(r==="tham"){ others=ids(function(x){return x==="qd"||x==="thuc";});
    if(others.length===2){label="Hai người toả hào quang"; extra="Một là Bồ Tát Quảng Đức, một là Ngô Đình Thục giả dạng.";}
    else if(others.length===1&&S.players[others[0]].role==="qd"){label="Người toả hào quang"; extra="Bàn này không có Ngô Đình Thục, nên người này chính là Bồ Tát Quảng Đức.";}
    else if(others.length===1){label="Người toả hào quang"; extra="Bàn này không có Bồ Tát Quảng Đức, nên người này là Ngô Đình Thục giả dạng.";}
    else {label="Không ai toả hào quang"; extra="Bàn này không có cả Quảng Đức lẫn Ngô Đình Thục.";} }
  else if(r==="can"){ label="Bạn không nhìn thấy ai"; extra="Đồng bọn cũng không biết bạn là ai."; }
  else if(ROLES[r].side==="do"){ others=ids(function(x){return ROLES[x].side==="do"&&x!=="can";}); label="Đồng bọn phe Đỏ Đen";
    var hasCan=S.players.some(function(p){return p.role==="can";});
    extra = hasCan?"Ngô Đình Cẩn cũng có trong bàn, nhưng bạn không biết là ai.":"";
    if(!others.length){label="Bạn không thấy đồng bọn nào"; } }
  else { label="Bạn không nhìn thấy ai"; extra="Vũ khí của bạn là quan sát các lá phiếu và kết quả nhiệm vụ."; }
  return {label:label, list:others, extra:extra};
}

function bindHold(){
  var b=document.getElementById("hold"), slot=document.getElementById("slot");
  if(!b)return;
  var showing=false;
  function show(e){ if(e&&e.preventDefault)e.preventDefault(); if(showing)return; showing=true;
    if(e&&e.pointerId!=null&&b.setPointerCapture){try{b.setPointerCapture(e.pointerId);}catch(x){}}
    slot.innerHTML=cardHtml(S.idx); b.classList.add("active"); b.textContent="Đang xem — thả tay để úp";}
  function hide(){ if(!showing)return; showing=false; slot.innerHTML=backHtml(); b.classList.remove("active"); b.textContent="Giữ để xem vai";
    if(!S.viewed){S.viewed=true; var d=document.querySelector('[data-act="revealDone"]'); if(d){d.disabled=false; var nx=d.parentNode.nextSibling; if(nx&&nx.tagName==="P")nx.remove();}}}
  b.addEventListener("pointerdown",show);
  ["pointerup","pointercancel","lostpointercapture","pointerleave"].forEach(function(ev){b.addEventListener(ev,hide);});
  b.addEventListener("contextmenu",function(e){e.preventDefault();});
  b.addEventListener("keydown",function(e){if(e.key===" "||e.key==="Enter"){show(e);}});
  b.addEventListener("keyup",function(e){if(e.key===" "||e.key==="Enter"){hide();}});
  b.addEventListener("blur",hide);
  hideHook=hide;
}
var hideHook=null;
document.addEventListener("visibilitychange",function(){if(document.hidden&&hideHook)hideHook();});

  h+='</ul><p class="count">Đồng Ý: <b style="color:'+(yes>=need?'var(--q1)':'var(--red-deep)')+'">'+yes+'</b> / '+S.n+' — cần '+need+' để đội lên đường</p>'+

  return h;
}
function voteResultHtml(){
  var P=S.pending, yes=P.yes, no=P.no, ok=P.ok;
  var h='<div class="verdict"><h2 style="color:'+(ok?'var(--gold)':'#FF8A7D')+'">'+(ok?'Đội được duyệt':'Đội bị từ chối')+'</h2><p>'+yes.length+' Đồng Ý, '+no.length+' Từ Chối — cần quá nửa ('+(Math.floor(S.n/2)+1)+') Đồng Ý.</p></div>';
  h+='<div class="vt"><div class="vcol yes"><h3>Đồng Ý</h3><ul>'+(yes.length?yes.map(function(i){return '<li>'+esc(nameOf(i))+'</li>';}).join(""):'<li>Không ai</li>')+'</ul></div>'+
     '<div class="vcol no"><h3>Từ Chối</h3><ul>'+(no.length?no.map(function(i){return '<li>'+esc(nameOf(i))+'</li>';}).join(""):'<li>Không ai</li>')+'</ul></div></div>';
  h+='<div class="gap"></div>';
  if(ok) h+='<p class="lede" style="text-align:center;margin-bottom:12px">Đội đi: <b style="color:var(--gold)">'+joinNames(S.team)+'</b></p><button class="btn btn-gold" data-act="toMission">Bắt đầu làm nhiệm vụ</button>';
  else {
    var max=5, r=S.rejects+1;

}

/* ================= MÀN: LÀM NHIỆM VỤ ================= */
function missionHtml(){

  if(S.sub==="pass"){
    return passHtml(nameOf(who), "Úp lá nhiệm vụ trong bí mật. Chỉ người trong đội mới cầm máy.", "Tôi là "+esc(nameOf(who))+", úp lá",
      (S.idx>0?"Đã nhận lá của "+esc(nameOf(S.order[S.idx-1]))+". ":"")+"Nhiệm vụ "+QUESTS[S.qi].word+" · lá "+(S.idx+1)+" / "+S.order.length);
  }

  var h='<section class="on-navy"><div class="secret-head"><div class="who">'+esc(nameOf(who))+'</div><p>Nhiệm vụ '+(S.qi+1)+' · '+QUESTS[S.qi].word+(S.quests[S.qi].need===2?' — cần 2 lá Phá Hoại mới hỏng':'')+'</p></div><div class="choices">';

function missionResultHtml(){

  var h='';

    return '<section class="pass on-navy"><div class="flag-line" aria-hidden="true">'+flagIs()+'</div><h1 class="who" style="font-size:32px">Đã đủ '+P.cards.length+' lá</h1>'+
      '<p class="why">Các lá đã được xáo trộn. Không ai biết ai úp lá nào. Đặt máy giữa bàn rồi lật bài.</p><button class="btn btn-gold" data-act="flipCards">Lật bài</button></section>';

     '<p>'+(P.fails===0?'Không có lá Phá Hoại nào.':P.fails+' lá Phá Hoại'+(S.quests[S.qi].need===2&&P.fails===1?' — chưa đủ 2 lá để làm hỏng nhiệm vụ này.':'.'))+'</p></div>';
  h+='<div class="cards" aria-label="Các lá nhiệm vụ đã xáo trộn">';

    h+='<div class="mc'+(S.flipped?' flip':'')+'"><div class="f"><i>'+'<b style="background:var(--q1)"></b><b style="background:var(--q2)"></b><b style="background:var(--q3)"></b><b style="background:var(--q4)"></b><b style="background:var(--q5)"></b>'+'</i></div>'+
      '<div class="bk '+c+'">'+(c==="hp"?'Hộ<br>Pháp':'Phá<br>Hoại')+'</div></div>';
  });
  h+='</div>'+boardHtml()+'<div class="gap"></div><button class="btn btn-gold" data-act="afterMission">Tiếp tục</button>';

}

/* ================= MÀN: CHỈ MẶT / CHỈ ĐIỂM ================= */
function nhuIndex(){for(var i=0;i<S.n;i++)if(S.players[i].role==="nhu")return i;return -1;}
function assassinIndex(){
  var n=nhuIndex(); if(n>=0)return n;
  for(var k=0;k<RED.length;k++){for(var i=0;i<S.n;i++)if(S.players[i].role===RED[k])return i;}
  return -1;
}
function assassinHtml(){
  var nhu=assassinIndex(), isNhu=S.players[nhu].role==="nhu", rn=ROLES[S.players[nhu].role].name;
  if(S.sub==="intro"){
    return '<section class="pass on-navy"><div class="flag-line" aria-hidden="true">'+flagIs()+'</div><h1 class="who" style="font-size:30px">Ba nhiệm vụ đã thành</h1>'+
      '<p class="why">Lá cờ sắp được kéo lên, nhưng phe Đỏ Đen còn một lần chỉ mặt Bồ Tát. Cả phe được bàn bạc công khai, chỉ một lần chọn duy nhất. Người cầm máy chỉ mặt là <b style="color:var(--gold)">'+esc(nameOf(nhu))+'</b> (vai '+rn+').</p>'+
      '<button class="btn btn-gold" data-act="assassinGo">Đưa máy cho '+esc(nameOf(nhu))+'</button></section>';
  }
  var reveal = S.sub==="flip";
  var h='<section class="on-navy"><div class="ahead"><h2>Phe Đỏ Đen chỉ mặt Bồ Tát</h2>'+
    '<p>'+(reveal?esc(nameOf(nhu))+' đã chỉ mặt <b>'+esc(nameOf(S.pick))+'</b>. Lật lá bài ra xem.'
      :esc(nameOf(nhu))+' ('+rn+') chạm vào lá bài của người mình cho là <b>Bồ Tát Thích Quảng Đức</b>, rồi bấm chỉ mặt.')+'</p></div>';
  h+='<div class="acards">';
  S.players.forEach(function(p,i){ if(i===nhu)return;
    var R=ROLES[p.role], tgt=reveal&&S.pick===i, sel=!reveal&&S.pick===i;
    var tag=reveal?'div':'button', attr=reveal?'':' data-act="pickOne" data-i="'+i+'" aria-pressed="'+(sel?'true':'false')+'"';
    h+='<'+tag+' class="ac'+(sel?' sel':'')+(tgt?' target':'')+(reveal&&!tgt?' dim':'')+'"'+attr+'>'+
      '<div class="ac-in">'+
        '<div class="af"><span class="afl" aria-hidden="true">'+flagIs()+'</span><span class="afn">'+esc(p.name)+'</span></div>'+
        '<div class="ab '+R.side+'">'+(IMG[p.role]?'<img src="'+IMG[p.role]+'" alt="">':'')+'<b>'+R.name+'</b></div>'+
      '</div></'+tag+'>';
  });
  h+='</div>';
  if(reveal){
    var right = S.players[S.pick].role==="qd";
    h+='<div class="alate"><p class="averdict" style="color:'+(right?'#FF8A7D':'var(--gold)')+'">'+
      (right?'Chỉ đúng. '+esc(nameOf(S.pick))+' chính là Bồ Tát Quảng Đức.':'Chỉ sai. '+esc(nameOf(S.pick))+' không phải Bồ Tát Quảng Đức.')+'</p>'+
      '<button class="btn btn-gold" data-act="assassinFinish">Xem kết quả</button></div>';
  } else {
    h+='<div style="margin-top:18px"><button class="btn btn-red" data-act="assassinate" '+(S.pick===null?'disabled':'')+'>'+(S.pick===null?'Chọn một lá bài':'Chỉ mặt '+esc(nameOf(S.pick)))+'</button></div>';
  }
  return h+'</section>';
}
/* ================= MÀN: KẾT THÚC ================= */
function endHtml(){
  var lamWin = S.winner==="lam";
  var title = lamWin?"Phe Lam Xanh thắng":"Phe Đỏ Đen thắng";
  var h='<section class="win '+(lamWin?'lam':'do')+'"><div class="flag-big'+(lamWin?'':' down')+'" aria-hidden="true">'+flagIs()+'</div><h1>'+title+'</h1><p>'+S.reason+'</p></section>';
  h+=boardHtml();
  h+='<h2 class="section-title">Vai của mọi người</h2><div class="roster">';
  S.players.forEach(function(p){var R=ROLES[p.role];
    h+='<div class="rc '+R.side+'">'+(IMG[p.role]?'<img src="'+IMG[p.role]+'" alt="">':'<div class="emblem" style="width:44px;height:64px" aria-hidden="true">'+flagIs()+'</div>')+
      '<div class="pn">'+esc(p.name)+'</div><div class="rn">'+R.name+'</div><span class="side '+R.side+'" style="margin:6px 0 0">'+(R.side==="lam"?"Lam Xanh":"Đỏ Đen")+'</span></div>';});
  h+='</div>'+logHtml(true)+'<div class="gap"></div><div class="stack"><button class="btn btn-gold" data-act="again">Chơi lại với nhóm này</button><button class="btn btn-line" data-act="home">Về trang đầu</button></div>';
  return h;
}

/* ================= DIỄN TIẾN ================= */
function render(scroll){
  var h="";
  hideHook=null;
  switch(S.screen){
    case "setup": h=setupHtml(); break;
    case "reveal": h=revealHtml(); break;
    case "team": h=teamHtml(); break;
    case "vote": h=voteHtml(); break;
    case "voteResult": h=voteResultHtml(); break;
    case "mission": h=missionHtml(); break;
    case "missionResult": h=missionResultHtml(); break;
    case "assassin": h=assassinHtml(); break;
    case "end": h=endHtml(); break;
  }
  app.innerHTML=h;
  if(S.screen==="reveal"&&S.sub==="hold")bindHold();
  if(S.screen==="assassin"&&S.sub==="flip"){
    var tc=document.querySelector(".ac.target");
    if(tc){var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      setTimeout(function(){tc.classList.add("flip");}, reduce?0:420);}
  }
  if(scroll!==false)window.scrollTo(0,0);
}
function go(screen,sub){S.screen=screen;S.sub=sub||null;S.pick=null;render();}

function nextQuestOrEnd(){
  var ok=S.quests.filter(function(q){return q.result==="ok";}).length;
  var bad=S.quests.filter(function(q){return q.result==="fail";}).length;
  if(bad>=3){ finish("do","Ba nhiệm vụ đã bị phá hỏng. Lá cờ không được kéo lên."); return; }
  if(ok>=3){
    var hasQd=S.players.some(function(p){return p.role==="qd";});
    if(hasQd&&assassinIndex()>=0) go("assassin","intro");
    else finish("lam","Ba nhiệm vụ đã thành. Ván này không có Bồ Tát Quảng Đức nên không có lượt Chỉ Mặt, lá cờ ngũ sắc tung bay.");
    return; }
  S.qi++; S.rejects=0; S.leader=(S.leader+1)%S.n; startTeam();
}
function startTeam(){ S.team = []; go("team"); }
function finish(w,reason){ S.winner=w; S.reason=reason; go("end"); }

function commitNames(){
  var names=[], seen={};
  for(var i=0;i<draft.n;i++){
    var v=(draft.names[i]||"").trim().replace(/\s+/g," ");
    if(!v) v="Người chơi "+(i+1);
    var key=v.toLocaleLowerCase("vi");
    if(seen[key]) return {error:"Có hai người cùng tên “"+v+"”. Hãy thêm chữ để phân biệt."};
    seen[key]=1; names.push(v);
  }
  return {names:names};
}

var ACTIONS = {
  count:function(d){ draft.n=+d.n; S.error=""; render(false); },
  start:function(){
    var r=commitNames(); if(r.error){S.error=r.error;render(false);return;}
    if(draft.n!==3&&!pickCounts(draft.n).ok){S.error="Số nhân vật chưa khớp: cần "+TABLE[draft.n][0]+" Lam Xanh và "+TABLE[draft.n][1]+" Đỏ Đen.";render(false);return;}
    saveNames(draft.n, draft.names.slice(0,10));
    startGame(draft.n, r.names, draft.n===3?null:getPick(draft.n)); render();
  },
  role:function(d){
    var n=draft.n, p=getPick(n).slice(), k=p.indexOf(d.r);
    if(k>=0)p.splice(k,1); else p.push(d.r);
    draft.picks[n]=p; saveNames(draft.n, draft.names.slice(0,10));
    S.error=""; keepScroll();
  },
  rolesDefault:function(){ delete draft.picks[draft.n]; saveNames(draft.n, draft.names.slice(0,10)); S.error=""; keepScroll(); },
  unveil:function(){
    if(S.screen==="reveal"){S.sub="hold";S.viewed=false;}
    else if(S.screen==="mission")S.sub="cast";
    render();
  },
  revealDone:function(){
    if(!S.viewed)return;
    if(S.idx<S.n-1){S.idx++;S.sub="pass";S.viewed=false;render();}
    else { S.lastMsg="Mọi người đã xem vai. Ván bắt đầu."; startTeam(); }
  },
  toggle:function(d){
    var i=+d.i, q=S.quests[S.qi], k=S.team.indexOf(i);
    if(k>=0)S.team.splice(k,1); else if(S.team.length<q.size)S.team.push(i);
    else { S.team.splice(S.team.length-1,1); S.team.push(i); }
    render(false);
  },
  lockTeam:function(){
    if(S.team.length!==S.quests[S.qi].size)return;
    S.team.sort(function(a,b){return a-b;});
    S.lastMsg="";
    S.order=[]; for(var k=0;k<S.n;k++)S.order.push((S.leader+k)%S.n);
    S.cast=[]; S.idx=0; go("vote");
  },
  vtoggle:function(d){ var i=+d.i; S.cast[i]=!S.cast[i]; render(false); },
  voteAll:function(){
    var all=true; for(var i=0;i<S.n;i++) if(!S.cast[i]) all=false;
    for(var j=0;j<S.n;j++) S.cast[j]=!all;
    render(false);
  },
  voteDone:function(){
    var yes=[],no=[]; for(var i=0;i<S.n;i++)(S.cast[i]?yes:no).push(i);
    S.pending={yes:yes,no:no,ok:yes.length>S.n/2};
    S.log[S.qi].proposals.push({leader:S.leader, team:S.team.slice(), yes:yes, no:no, ok:S.pending.ok});
    S.cast=[]; go("voteResult","shown");
  },
  toMission:function(){ S.order=S.team.slice(); S.cast=[]; S.idx=0; go("mission","pass"); },
  afterReject:function(){
    S.rejects++;
    if(S.rejects>=5){ finish("do","Năm lần từ chối liên tiếp trong cùng một nhiệm vụ. Phe Lam Xanh không thể thống nhất."); return; }
    S.leader=(S.leader+1)%S.n; S.lastMsg="Đội trước bị từ chối. Chỉ Huy mới lập đội."; startTeam();
  },
  play:function(d){
    var who=S.order[S.idx];
    var v = (d.v==="ph" && roleOf(who).side==="do") ? "ph" : "hp";
    S.cast.push(v);
    if(S.idx<S.order.length-1){S.idx++;S.sub="pass";render();}
    else {
      var cards=shuffle(S.cast), fails=cards.filter(function(c){return c==="ph";}).length;
      var q=S.quests[S.qi];
      S.pending={cards:cards, fails:fails, result:fails>=q.need?"fail":"ok"};
      S.cast=[]; S.flipped=false; go("missionResult","ready");
    }
  },
  flipCards:function(){
    var P=S.pending, q=S.quests[S.qi], L=S.log[S.qi];
    q.result=P.result; L.result=P.result; L.team=S.team.slice(); L.fails=P.fails;
    S.flipped=false; S.sub="shown"; render();
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var cs=document.querySelectorAll(".mc");
    cs.forEach(function(c,i){ setTimeout(function(){c.classList.add("flip");}, reduce?0:250+i*220); });
    setTimeout(function(){S.flipped=true;}, reduce?0:250+cs.length*220);
  },
  afterMission:function(){ S.flipped=true; S.lastMsg="Nhiệm vụ "+QUESTS[S.qi].word+(S.quests[S.qi].result==="ok"?" thành công.":" hỏng.")+" Thẻ Chỉ Huy chuyền sang người kế."; nextQuestOrEnd(); },
  assassinGo:function(){ S.sub="pick"; S.pick=null; render(); },
  pickOne:function(d){ S.pick=+d.i; render(false); },
  assassinate:function(){
    if(S.pick===null)return;
    S.sub="flip"; render();
  },
  assassinFinish:function(){
    if(S.pick===null)return;
    var t=S.pick, qd=S.players[t].role==="qd";
    var nhu=assassinIndex(), who=esc(nameOf(nhu))+" ("+ROLES[S.players[nhu].role].name+")", qdi=-1;
    S.players.forEach(function(p,i){if(p.role==="qd")qdi=i;});
    if(qd) finish("do",who+" chỉ đúng "+esc(nameOf(t))+" là Bồ Tát Quảng Đức. Phe Đỏ Đen lật ngược thế cờ.");
    else finish("lam",who+" chỉ nhầm "+esc(nameOf(t))+". Bồ Tát Quảng Đức là "+esc(nameOf(qdi))+". Lá cờ ngũ sắc tung bay.");
  },
  again:function(){ var names=S.players.map(function(p){return p.name;}); startGame(S.n,names,S.roleSet); render(); },
  home:function(){ S=blank(); render(); },
  rules:function(){ openModal(rulesHtml()); },
  newgame:function(){
    if(!inGame()){ S=blank(); closeModal(); render(); return; }
    openModal('<h2>Bỏ ván đang chơi?</h2><p>Ván này chưa kết thúc. Nếu bỏ, vai và kết quả các nhiệm vụ sẽ mất.</p><div class="row"><button class="btn btn-navy" data-act="closeModal">Tiếp tục chơi</button><button class="btn btn-line" style="color:var(--red-deep);border-color:var(--red)" data-act="quit1">Bỏ ván</button></div>');
  },
  quit1:function(){
    openModal('<h2>Xác nhận lần cuối</h2><p>Mọi vai bí mật sẽ bị xoá và không khôi phục được. Tên người chơi vẫn được giữ lại.</p><div class="row"><button class="btn btn-navy" data-act="closeModal">Quay lại ván</button><button class="btn btn-red" data-act="quit2">Xoá ván</button></div>');
  },
  quit2:function(){ S=blank(); closeModal(); render(); },
  closeModal:function(){ closeModal(); }
};

function keepScroll(){var y=window.scrollY;render(false);window.scrollTo(0,y);}

/* ================= LUẬT CHƠI ================= */
function rulesHtml(){
  return '<h2>Luật chơi Ngũ Sắc Kỳ</h2>'+
  '<div class="qline">'+QUESTS.map(function(q){return '<span style="background:'+q.color+';color:'+q.ink+'">'+q.word+'</span>';}).join("")+'</div>'+
  '<p class="muted">Năm nhiệm vụ theo thứ tự màu cờ.</p>'+
  '<h3>Mục tiêu</h3><p><b>Lam Xanh</b> cần 3 nhiệm vụ thành công, rồi còn phải sống sót qua lượt Chỉ Mặt. <b>Đỏ Đen</b> thắng nếu 3 nhiệm vụ hỏng, nếu một nhiệm vụ bị từ chối 5 lần liên tiếp, hoặc nếu chỉ đúng Bồ Tát Quảng Đức ở lượt Chỉ Mặt.</p>'+
  '<h3>Lượt Chỉ Mặt</h3><p>Đủ 3 nhiệm vụ thành thì phe Đỏ Đen luôn được một lần chỉ mặt, dù ván có Ngô Đình Nhu hay không. Người cầm máy chỉ mặt là Ngô Đình Nhu; nếu ván không có Nhu thì đến lượt Ngô Đình Diệm, rồi Thục, Cẩn, Trà Trộn I, Trà Trộn II — ai có mặt trước trong thứ tự đó thì người ấy chỉ. Cả phe được bàn bạc công khai, nhưng chỉ một lần chọn duy nhất. Chỉ đúng thì Đỏ Đen thắng, chỉ sai thì Lam Xanh thắng. Ván nào không có Bồ Tát Quảng Đức thì bỏ lượt này.</p>'+
  '<h3>Một vòng chơi</h3><ol><li>Chỉ Huy chọn đủ số người đi nhiệm vụ.</li><li>Cả bàn bỏ phiếu công khai trên cùng một màn hình: chạm vào tên người Đồng Ý. Quá nửa Đồng Ý thì đội lên đường.</li><li>Bị từ chối: Chỉ Huy chuyển sang người kế, tiến 1 ô lượt bầu.</li><li>Người trong đội úp lá: Lam Xanh bắt buộc Hộ Pháp, Đỏ Đen chọn Hộ Pháp hoặc Phá Hoại. Lá được xáo trước khi lật.</li><li>1 lá Phá Hoại là hỏng — riêng nhiệm vụ 4 (Tín) ở bàn từ 7 người cần 2 lá.</li><li>Sau mỗi nhiệm vụ, Chỉ Huy chuyển sang người kế và lượt bầu về 0.</li></ol>'+
  '<h3>Nhân vật có phép</h3><ul><li><b>Quảng Đức</b> thấy phe Đỏ Đen, trừ Diệm.</li><li><b>Lê Đình Thám</b> thấy Quảng Đức và Thục toả hào quang, không biết ai là ai.</li><li><b>Diệm</b> ẩn khỏi mắt Quảng Đức.</li><li><b>Nhu</b> là người cầm máy ở lượt Chỉ Mặt khi có mặt.</li><li><b>Thục</b> giả hào quang trước mắt Lê Đình Thám.</li><li><b>Cẩn</b> không biết đồng bọn, đồng bọn cũng không biết Cẩn.</li></ul>'+
  '<h3>Chọn nhân vật</h3><p>Ở trang đầu, cả nhóm có thể chọn nhân vật nào vào ván, miễn đủ số lá Lam Xanh và Đỏ Đen theo số người. Thiếu Ngô Đình Nhu thì lượt Chỉ Mặt vẫn diễn ra, chỉ đổi người cầm máy. Chỉ khi thiếu Bồ Tát Quảng Đức mới bỏ lượt này.</p>'+
  '<h3>Số người</h3><div class="tbl-wrap"><table><tr><th>Người</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>'+
  '<tr><th>Lam</th><td>3</td><td>4</td><td>4</td><td>5</td><td>6</td><td>6</td></tr><tr><th>Đỏ</th><td>2</td><td>2</td><td>3</td><td>3</td><td>3</td><td>4</td></tr>'+
  QUESTS.map(function(q,i){return '<tr><th style="background:'+q.color+';color:'+q.ink+'">'+q.word+'</th>'+[5,6,7,8,9,10].map(function(n){return '<td>'+SIZES[n][i]+(n>=7&&i===3?'*':'')+'</td>';}).join("")+'</tr>';}).join("")+
  '</table></div><p class="muted">* cần 2 lá Phá Hoại mới hỏng.</p>'+
  '<div class="row"><button class="btn btn-navy" data-act="closeModal">Đóng</button></div>';
}
var modalRoot=document.getElementById("modal-root"), lastFocus=null;
function openModal(html){
  if(!modalRoot.firstChild)lastFocus=document.activeElement;
  modalRoot.innerHTML='<div class="modal" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" tabindex="-1">'+html+'</div></div>';
  var sh=modalRoot.querySelector(".sheet"); sh.focus();
}
function closeModal(){modalRoot.innerHTML=""; if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){} }

/* ================= SỰ KIỆN ================= */
var app=document.getElementById("app");
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]"); if(!t)return;
  var act=t.getAttribute("data-act");
  if(act==="backdrop"){ if(e.target===t)closeModal(); return; }
  if(t.disabled)return;
  var fn=ACTIONS[act]; if(fn)fn(t.dataset);
});
document.addEventListener("input",function(e){
  if(e.target.matches(".names input")){ draft.names[+e.target.dataset.i]=e.target.value; }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&modalRoot.firstChild)closeModal();
  if(e.key==="Enter"&&e.target.matches(".names input")){
    var nx=document.querySelector('.names input[data-i="'+(+e.target.dataset.i+1)+'"]');
    if(nx)nx.focus(); else ACTIONS.start();
  }
});
window.addEventListener("beforeunload",function(e){ if(inGame()){e.preventDefault();e.returnValue="";} });

render();
})();
</script>
</body>
</html>
