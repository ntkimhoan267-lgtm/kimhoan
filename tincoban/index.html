<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn trắc nghiệm Tin học cơ bản</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c2a3a;--card:#eadfbf;--card2:#f5eed8;--ink:#1d2b3f;--muted:#5d6472;--ok:#2e6b45;--bad:#a83232;--line:#b8a77a;--accent:#b7472a;
--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111b26}}
:root[data-theme="dark"]{--bg:#111b26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:18px 14px 40px}
.top{color:#e9e2cc;margin:4px 2px 16px}
.top h1{font-family:var(--mono);font-weight:600;font-size:1.35rem;line-height:1.25;margin:0}
.top p{margin:4px 0 0;color:#b9c1cc;font-size:.95rem}
.card{position:relative;background:var(--card);border-radius:4px;padding:18px 16px 18px;box-shadow:0 10px 26px rgba(0,0,0,.35);
  clip-path:polygon(22px 0,100% 0,100% 100%,0 100%,0 22px)}
.cols{display:flex;gap:3px;margin:-4px 0 12px;overflow:hidden;height:10px}
.cols i{flex:1;min-width:3px;border-radius:1px;background:rgba(29,43,63,.12)}
.cols i.ok{background:var(--ok)}.cols i.bad{background:var(--bad)}.cols i.now{background:var(--ink)}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.82rem;color:var(--muted);margin-bottom:6px}
.q{font-weight:700;font-size:1.12rem;line-height:1.4;margin:4px 0 14px}
.opts{display:grid;gap:9px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card2);border:1.5px solid var(--line);border-radius:4px;padding:11px 12px;font-size:1rem}
.opt b{font-family:var(--mono);flex:none;width:1.4em}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:10px 12px;border-left:4px solid var(--ok);background:rgba(46,107,69,.1);display:none}
.fb.bad{border-color:var(--bad);background:rgba(168,50,50,.08)}
.fb.show{display:block}
.note{margin-top:8px;padding:10px 12px;border-left:4px solid var(--accent);background:rgba(183,71,42,.1);font-size:.95rem;display:none}
.note.show{display:block}
.btn{margin-top:14px;width:100%;background:var(--ink);color:var(--card);border:0;border-radius:4px;padding:13px;font-weight:700;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
h2{font-family:var(--mono);font-weight:600;font-size:1.05rem;margin:0 0 10px}
.secs{display:grid;gap:8px}
.sec{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--card2);border:1.5px solid var(--line);border-radius:4px;padding:11px 12px}
.sec.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.sec small{display:block;font-size:.85rem;opacity:.75}
.sec .c{font-family:var(--mono);font-size:.9rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;background:var(--card2);border:1.5px solid var(--line);border-radius:4px;padding:9px 6px;font-family:var(--mono);font-size:.9rem}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.row{margin-top:16px}
.lbl{font-size:.9rem;color:var(--muted);margin:0 0 6px}
.score{font-family:var(--mono);font-size:3rem;font-weight:600;line-height:1;margin:6px 0}
.rev div{padding:10px 0;border-top:1px dashed var(--line);font-size:.95rem}
.rev i{color:var(--muted);font-style:normal}
.progress{height:6px;background:rgba(29,43,63,.12);border-radius:3px;margin:0 0 12px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink)}
.tip{color:#b9c1cc;font-size:.85rem;text-align:center;margin-top:14px}
</style>
</head>
<body>
<main>
<div class="top"><h1>Trắc nghiệm Tin học cơ bản</h1><p>210 câu · Windows, Word, Excel, PowerPoint, mạng & Internet</p></div>
<div id="app"></div>
<p class="tip" id="tip"></p>
</main>
<script>
const BANK=[["gen-1","gen",1,"Để tắt máy tính đúng cách ta chọn",["Tắt nguồn điện","Bấm nút Power trên hộp máy","Bấm nút Reset trên hộp máy","Nhấn nút Start ở góc dưới bên trái màn hình nền và chọn mục Shutdown."],3],["gen-2","gen",2,"Để phòng chống Virus cách tốt nhất là?",["Thường xuyên kiểm tra đĩa, đặc biệt thận trọng khi sao chép dữ liệu","Sử dụng các chương trình cập nhật thường xuyên","Thường xuyên lưu dữ liệu","Sử dụng ứng dụng bảo vệ ổ đĩa"],0],["gen-3","gen",3,"Khi đặt tên tệp hoặc thư mục trong DOS không được sử dụng các ký tự nào sau đây?",[". , ? \\ / ; : = < > [ ]","Các chữ số từ 1 đến 5","Các chữ cái từ A đến G","Các chữ và số đi cùng nhau"],0],["gen-4","gen",4,"Chọn câu trả lời thích hợp nhất: “Tại sao phải định kì sử dụng công cụ chống phân mảnh đĩa cứng:",["Để ổ đĩa cứng máy tính lâu hỏng","Để tốc độ truy xuất dữ liệu từ đĩa cứng nhanh hơn","Để tạo ra nhiều không gian trống hơn trong đĩa cứng","Để nén dữ liệu trong đĩa cứng tốt hơn"],1],["gen-5","gen",5,"Virus tin học thực chất là?",["Một loại vi sinh vật sống ký sinh trên các thiết bị vật lý của máy tính","Một kháng thể không tồn tại","Một đoạn chương trình có kích thước lớn","Tồn tại bên ngoài không khí"],0,"Thực tế: virus máy tính là một chương trình do con người viết ra, không phải vi sinh vật. Đáp án A là theo đề thi."],["gen-6","gen",6,"Bạn đã cài đặt một đĩa hoàn toàn mới và bạn muốn định dạng nó. Mục đích của công việc định dạng là gì?",["Phục hồi dữ liệu bị mất trong đĩa","Tạo một đĩa chỉ đọc","Tạo một đĩa để đọc và chấp nhận dữ liệu","Làm cho nhiều người sử dụng có thể truy nhập được đĩa"],2],["gen-7","gen",7,"Các phát biểu sau, phát biểu nào đúng:",["Tên File không được chứa khoảng trắng","Tên File không nên có dấu tiếng Việt","Tên File được dài trên 255 kí tự","Tên File được chấp nhận kí tự #"],1],["gen-8","gen",8,"Bạn nhận được một bức thư điện tử chứa tệp tin đính kèm mà bạn không nhận biết ra, bạn sẽ xử lý thế nào trong tình huống này để đảm bảo an toàn?",["Mở tệp tin này ra để kiểm tra loại tệp tin","Chuyển thư này cho ai đó mà bạn nghĩ rằng bạn có thể nhận biết được","Quét tập tin này bằng chương trình chống virus","Lưu bản sao tập tin này vào đĩa cứng và mở bản sao này"],2],["gen-9","gen",9,"Câu nào dưới đây không đúng?",["Vi rút máy tính lây nhiễm qua khi dùng chung máy tính","Vi rút máy tính lây nhiễm khi sao chép qua đĩa mềm, đĩa CD","Vi rút máy tính lây nhiễm khi sao chép qua mạng","Vi rút máy tính lây nhiễm qua Internet"],0],["gen-10","gen",10,"Ở tình huống nào dưới đây, máy tính thực thi công việc tốt hơn con người?",["Khi dịch một cuốn sách","Khi chẩn đoán bệnh","Khi phân tích tâm lý một con người","Khi thực hiện một phép toán phức tạp"],3],["gen-11","gen",11,"Virus máy tính lây lan qua những con đường nào ?",["Qua thiết bị nhớ USB.","Từ các file","Từ các ứng dụng","Từ Ram."],0],["gen-12","gen",12,"Phát biểu nào về hệ điều hành sau đây là không đúng ?",["Hệ điều hành đảm bảo giao tiếp giữa người dùng và máy tính.","Chức năng chính của hệ điều hành là thực hiện tìm kiếm thông tin trên Internet.","Hệ điều hành cung cấp các phương tiện và dịch vụ để người sử dụng dễ dàng thực hiện chương trình, quản lí chặt chẽ, khai thác các tài nguyên của máy tính một cách tối ưu.","Hệ điều hành Windows là một hệ điều hành dùng cho máy tính cá nhân của hãng Microsoft."],1],["gen-13","gen",13,"Trong hệ điều hành Windows, để mở chương trình quản lý tác vụ (Task Manager) bạn dùng tổ hợp phím:",["Ctrl + S","Alt + F4","Ctrl + Alt + F4","Ctrl + Alt + Delete"],3],["gen-14","gen",14,"Trong máy tính, thông tin tồn tại dưới các dạng tập tin nào ?",["Tập tin chương trình","Tập tin dữ liệu","Cả hai đều đúng","Cả hai đều sai"],2],["gen-15","gen",15,"Khi khởi động máy tính, phần mềm nào được thực hiện trước ?",["Hệ điều hành","Phần mềm gõ tiếng Việt","Phần mềm diệt Virus máy tính","Phần mềm Word, Excel"],0],["gen-16","gen",16,"Theo bạn phần mềm Windows, Linux có đặc điểm nào chung ?",["Cả hai đều là phần mềm ứng dụng","Cả hai đều là thiết bị phần cứng","Cả hai đều là hệ điều hành","Cả hai đều là phần mềm hệ thống"],2],["gen-17","gen",17,"Khi đang dùng máy tính, để khởi động lại hệ thống thì bạn dùng cách nào sau đây:",["Tại giao diện desktop => Alt + F4 => Restart","Kích Start menu => Shutdown","Bấm nút Restart trên hộp máy","Bấm Alt + F4."],0],["gen-18","gen",18,"Khi đang dùng máy tính, để tắt hệ thống đúng cách thì bạn dùng cách nào sau đây:",["Rút dây nguồn điện máy tính","Kích Start menu => Shutdown","Bấm nút Power trên hộp máy","Bấm nút Reset trên hộp máy"],1],["gen-19","gen",19,"Trong hệ điều hành Windows, muốn khởi chạy một chương trình nào đó thì:",["Mở My Computer và kích đôi chuột trái vào tên chương trình","Mở và kích vào chương trình => bấm Enter","Mở và kích chuột phải vào chương trình => Open","Mở và kích đôi chuột trái vào tên chương trình"],0],["gen-20","gen",20,"Trong hệ điều hành Windows, khi đang mở cửa sổ thư mục hiện hành bạn muốn trở về màn hình nền desktop thì:",["Bấm tổ hợp phím Windows + D","Kích chuột phải lên thanh Taskbar => Show the desktop","Cả hai cách trên đều đúng","Cả hai cách trên đều sai."],2],["gen-21","gen",21,"Trong hệ điều hành Windows, các tập tin được chọn và xoá bằng tổ hợp phím Shift + Delete thì:",["Có thể khôi phục bằng cách mở trong My Computer","Có thể khôi phục bằng cách mở trong My Documents","Có thể khôi phục bằng cách mở trong Recycle Bin","Không thể khôi phục lại được."],3],["gen-22","gen",22,"Trong hệ điều hành Windows, biểu tượng của thư mục thường có màu?",["Xanh","Đỏ","Tím","Vàng"],3],["gen-23","gen",23,"Trong hệ điều hành Windows, thư mục thường được tổ chức dưới dạng:",["Chuỗi","Dây","Cây","Đồ thị"],2],["gen-24","gen",24,"Trong hệ điều hành Windows, để mở chương trình quản lý tác vụ (Task Manager) thì bạn dùng tổ hợp phím nào:",["Ctrl + F1","Alt + F4","Ctrl + Alt + Delete","Ctrl + Shift + Delete"],2],["gen-25","gen",25,"Trong My Computer của hệ điều hành Windows, để xoá một đối tượng tập tin hay thư mục thì bạn:",["Kích vào đối tượng đó và nhấn phím Delete","Kích chuột l muốn đính kèm tập tin chúng ta chọn?",["Send","Copy","Attachment","File/save"],2],["lan-37","lan",37,"Phần mềm nào dưới đây không phải là trình duyệt?",["Cốc Cốc","Firefox","Safari","VLC Player"],3],["lan-38","lan",38,"Nút BACK trên trình duyệt dùng để?",["Trở lại trang trước","Đi đến trang kế tiếp","Truy cập lịch sử duyệt web","Về trang chủ"],0],["lan-46","lan",46,"Để điều khiển máy tính từ xa trong mạng LAN, ta thường sử dụng phần mềm nào?",["Remote Desktop Connection","Team Viewer","Chrome","VLC Player"],0],["lan-60","lan",60,"WWW viết tắt của?",["Word Wide Web","World Wide Wed","Wed wide world","Win Word Wed"],1,"WWW = World Wide Web. Đáp án đề (B) có lỗi chính tả “Wed”."],["lan-61","lan",61,"Những phần mềm nào dùng để duyệt web?",["Chrome","Hệ điều hành","Ứng dụng văn phòng","Hệ thống mạng"],0],["lan-62","lan",62,"HTTP là gì?",["Giao thức truyền siêu văn bản","Ngôn ngữ soạn thảo web","Tên của trang web","Địa chỉ của trang web"],0],["lan-68","lan",68,"Đèn Link của Router ADSL không sáng. Lỗi này có thể là lỗi nào sau đây",["Hỏng dây điện thoại","Hỏng dây Cable","Hỏng đầu RJ45","Hỏng Switch"],0],["lan-69","lan",69,"Đèn Data của Router ADSL không sáng. Lỗi này có thể là lỗi nào sau đây",["Kết nối về ISP bị lỗi","Hỏng dây điện thoại","Hỏng đầu RJ45","Hỏng dây Cable"],0],["lan-70","lan",70,"Icon Lan (nằm dưới system bar) bị dấu chéo đỏ. Lỗi này có thể là lỗi nào sau đây",["Hỏng cable","Hỏng dây điện thoại","Kết nối về ISP bị lỗi","Hỏng Switch"],0],["lan-71","lan",71,"Icon Lan (nằm dưới system bar) bị dấu chấm thang vàng. Lỗi này có thể là lỗi nào sau đây",["Lỗi thiết lập địa chỉ IP","Hỏng cable","Hỏng dây điện thoại","Kết nối về ISP bị lỗi"],0],["lan-98","lan",98,"Laptop có thể vừa sử dụng card mạng có dây và không dây được hay không",["Được","Không","Được, nhưng phải của hãng LinkSys","Được, nhưng thiết bị phải do ISP cấp"],0]];
const SECS=[["gen","Kiến thức chung"],["win","Windows 10"],["word","MS Word 2013"],["excel","MS Excel 2013"],["ppt","MS PowerPoint 2013"],["lan","Mạng LAN / Internet"]];
const SNAME=Object.fromEntries(SECS);
const app=document.getElementById("app");
const L="ABCD";
let S=null,pick={secs:new Set(SECS.map(s=>s[0])),n:20};
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function wrongSet(){return new Set(store("thcbWrong")||[])}
function saveWrong(s){store("thcbWrong",[...s])}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){
  const w=wrongSet();const best=store("thcbBest")||{};
  const cnt=id=>BANK.filter(q=>q[1]===id).length;
  const total=()=>BANK.filter(q=>pick.secs.has(q[1])).length;
  app.innerHTML=`<div class="card"><h2>Chọn phần ôn</h2><div class="secs" id="secs">${SECS.map(([id,n])=>`<button class="sec ${pick.secs.has(id)?"on":""}" data-s="${id}" aria-pressed="${pick.secs.has(id)}"><span>${n}${best[id]!=null?`<small>Lần gần nhất: ${best[id]}%</small>`:""}</span><span class="c">${cnt(id)} câu</span></button>`).join("")}</div>
  <div class="row"><p class="lbl">Số câu mỗi lượt</p><div class="seg" id="seg">${[10,20,40,0].map(n=>`<button data-n="${n}" class="${pick.n===n?"on":""}">${n||"Tất cả"}</button>`).join("")}</div></div>
  <button class="btn" id="go">Bắt đầu · <span id="tot"></span></button>
  <button class="btn ghost" id="wr" ${w.size?"":"disabled"}>Ôn lại câu làm sai (${w.size})</button></div>`;
  const upd=()=>{const t=total();document.getElementById("tot").textContent=`${pick.n&&pick.n<t?pick.n:t} câu`;document.getElementById("go").disabled=!t};
  app.querySelectorAll(".sec").forEach(b=>b.onclick=()=>{const id=b.dataset.s;pick.secs.has(id)?pick.secs.delete(id):pick.secs.add(id);b.classList.toggle("on");b.setAttribute("aria-pressed",pick.secs.has(id));upd()});
  app.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{pick.n=+b.dataset.n;app.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));upd()});
  document.getElementById("go").onclick=()=>{let pool=shuffle(BANK.filter(q=>pick.secs.has(q[1])));if(pick.n)pool=pool.slice(0,pick.n);start(pool,"normal")};
  document.getElementById("wr").onclick=()=>{const pool=shuffle(BANK.filter(q=>w.has(q[0])));start(pool,"wrong")};
  upd();document.getElementById("tip").textContent="Mẹo: trên máy tính có thể bấm phím A B C D hoặc 1 2 3 4 để trả lời, Enter để sang câu.";
}
function start(qs,mode){S={qs,i:0,res:[],mode};render()}
function render(){
  const q=S.qs[S.i];const n=S.qs.length;
  const cols=n<=60?`<div class="cols" aria-hidden="true">${S.qs.map((_,k)=>`<i class="${S.res[k]===true?"ok":S.res[k]===false?"bad":k===S.i?"now":""}"></i>`).join("")}</div>`:`<div class="progress"><span style="width:${S.i/n*100}%"></span></div>`;
  app.innerHTML=`<div class="card">${cols}<div class="meta"><span>Câu ${S.i+1}/${n}</span><span>${esc(SNAME[q[1]])} · #${q[2]}</span></div>
  <p class="q">${esc(q[3])}</p><div class="opts">${q[4].map((t,k)=>`<button class="opt" data-k="${k}"><b>${L[k]}.</b><span>${esc(t)}</span></button>`).join("")}</div>
  <div class="fb" id="fb" role="status"></div><div class="note" id="nt"></div>
  <button class="btn" id="nx" style="display:none">${S.i===n-1?"Xem kết quả":"Câu tiếp"}</button>
  <button class="btn ghost" id="qt">Dừng & xem kết quả</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  document.getElementById("qt").onclick=finish;
}
function answer(k){
  if(S.res[S.i]!==undefined)return;
  const q=S.qs[S.i],ok=k===q[5];S.res[S.i]=ok;S.qs[S.i]._pick=k;
  const w=wrongSet();ok?w.delete(q[0]):w.add(q[0]);saveWrong(w);
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q[5])b.classList.add("right");else if(j===k)b.classList.add("wrong")});
  const fb=document.getElementById("fb");fb.className="fb show"+(ok?"":" bad");fb.innerHTML=ok?"<b>Đúng!</b>":`<b>Chưa đúng.</b> Đáp án: <b>${L[q[5]]}. ${esc(q[4][q[5]])}</b>`;
  if(q[6]){const nt=document.getElementById("nt");nt.classList.add("show");nt.innerHTML="<b>Lưu ý:</b> "+esc(q[6])}
  const c=app.querySelector(".cols i:nth-child("+(S.i+1)+")");if(c){c.className=ok?"ok":"bad"}
  const nx=document.getElementById("nx");nx.style.display="block";nx.focus();nx.onclick=next;
}
function next(){S.i++;S.i<S.qs.length?render():finish()}
function finish(){
  const done=S.res.filter(r=>r!==undefined).length;const c=S.res.filter(Boolean).length;const p=done?Math.round(c/done*100):0;
  if(S.mode==="normal"&&done){const best=store("thcbBest")||{};const bySec={};S.qs.forEach((q,k)=>{if(S.res[k]===undefined)return;(bySec[q[1]]=bySec[q[1]]||[0,0]);bySec[q[1]][1]++;if(S.res[k])bySec[q[1]][0]++});for(const s in bySec)best[s]=Math.round(bySec[s][0]/bySec[s][1]*100);store("thcbBest",best)}
  const wrong=S.qs.map((q,k)=>({q,k})).filter(x=>S.res[x.k]===false);
  app.innerHTML=`<div class="card"><h2>Kết quả</h2><div class="score">${p}%</div><p>${c}/${done} câu đúng${done<S.qs.length?` (đã làm ${done}/${S.qs.length})`:""}</p>
  ${wrong.length?`<div class="rev"><h2 style="margin-top:14px">Câu làm sai</h2>${wrong.map(({q})=>`<div><b>${esc(q[3])}</b><br><i>Bạn chọn: ${L[q._pick]}. ${esc(q[4][q._pick])}</i><br>Đáp án: <b>${L[q[5]]}. ${esc(q[4][q[5]])}</b>${q[6]?`<br><i>Lưu ý: ${esc(q[6])}</i>`:""}</div>`).join("")}</div>`:""}
  <button class="btn" id="hm">Về trang chọn phần</button></div>`;
  document.getElementById("hm").onclick=home;window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{if(!S||!document.getElementById("nx"))return;const m={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3}[e.key.toLowerCase()];
  if(m!==undefined&&S.res[S.i]===undefined)answer(m);else if(e.key==="Enter"&&S.res[S.i]!==undefined){e.preventDefault();next()}});
home();
</script>
